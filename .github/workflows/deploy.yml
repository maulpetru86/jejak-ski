name: Deploy ke Firebase Hosting Otomatis

on:
  push:
    branches:
      - main

# SEC-008: Least privilege — hanya read access ke repository contents
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependensi
        run: npm ci

      - name: Validasi Kurikulum
        run: npm run check

      - name: Build Situs Statis
        run: npm run build

      - name: Deploy ke Firebase Hosting
        uses: w9jds/firebase-action@b149fcd86198236adeebd9ba3dcafe5da86eb0cd # v13.29.1
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: jejak-ski
