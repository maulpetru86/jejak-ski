name: Deploy ke Firebase Hosting Otomatis

on:
  push:
    branches:
      - main

# SEC-008: Least privilege — hanya read access ke repository contents
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependensi
        run: npm ci

      - name: Build Situs Statis
        run: npm run build

      - name: Deploy ke Firebase Hosting
        uses: w9jds/firebase-action@7238bf3e459b061e0a1205b4b14e55348b291fc6 # v13.29.1
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: jejak-ski
