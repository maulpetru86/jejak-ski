<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gold gradient for arch border -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A24E"/>
      <stop offset="50%" stop-color="#E5B869"/>
      <stop offset="100%" stop-color="#C49232"/>
    </linearGradient>
    <!-- Green gradient for arch fill -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4D36"/>
      <stop offset="100%" stop-color="#0E291C"/>
    </linearGradient>
    <!-- Clip path for the Islamic arch (pointed ogee arch shape) -->
    <clipPath id="archClip">
      <path d="M100 8 C100 8, 170 55, 170 110 C170 145, 140 172, 100 172 C60 172, 30 145, 30 110 C30 55, 100 8, 100 8Z"/>
    </clipPath>
  </defs>

  <!-- === OUTER GOLD ARCH BORDER === -->
  <path d="M100 4 C100 4, 175 52, 175 112 C175 148, 143 177, 100 177 C57 177, 25 148, 25 112 C25 52, 100 4, 100 4Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>

  <!-- === INNER GREEN ARCH FILL === -->
  <path d="M100 8 C100 8, 170 55, 170 110 C170 145, 140 172, 100 172 C60 172, 30 145, 30 110 C30 55, 100 8, 100 8Z"
        fill="url(#greenGrad)"/>

  <!-- === STARS / NIGHT SKY dots === -->
  <g clip-path="url(#archClip)" opacity="0.4">
    <circle cx="55" cy="45" r="1" fill="#FBF9F4"/>
    <circle cx="75" cy="35" r="0.8" fill="#FBF9F4"/>
    <circle cx="130" cy="40" r="1" fill="#FBF9F4"/>
    <circle cx="145" cy="55" r="0.7" fill="#FBF9F4"/>
    <circle cx="60" cy="65" r="0.6" fill="#FBF9F4"/>
    <circle cx="140" cy="70" r="0.8" fill="#FBF9F4"/>
  </g>

  <!-- === CRESCENT MOON === -->
  <g transform="translate(100, 38)">
    <circle cx="0" cy="0" r="10" fill="#E5B869"/>
    <circle cx="4" cy="-3" r="8" fill="#163E2B"/>
  </g>

  <!-- === MAIN MOSQUE (Center dome + minarets) === -->
  <g clip-path="url(#archClip)">
    <!-- Sky glow behind mosque -->
    <ellipse cx="100" cy="125" rx="55" ry="30" fill="#1B4D36" opacity="0.5"/>

    <!-- Left minaret -->
    <rect x="50" y="88" width="8" height="52" rx="1" fill="#E8E2D0"/>
    <rect x="49" y="84" width="10" height="6" rx="1" fill="#E5B869"/>
    <polygon points="54,72 49,84 59,84" fill="#E5B869"/>

    <!-- Right minaret -->
    <rect x="142" y="88" width="8" height="52" rx="1" fill="#E8E2D0"/>
    <rect x="141" y="84" width="10" height="6" rx="1" fill="#E5B869"/>
    <polygon points="146,72 141,84 151,84" fill="#E5B869"/>

    <!-- Central mosque body -->
    <rect x="62" y="110" width="76" height="30" rx="2" fill="#E8E2D0"/>

    <!-- Arched doorway -->
    <path d="M92 140 L92 122 C92 116, 108 116, 108 122 L108 140 Z" fill="#163E2B" opacity="0.7"/>

    <!-- Main dome -->
    <ellipse cx="100" cy="103" rx="28" ry="18" fill="#E8E2D0"/>
    <path d="M72 103 C72 85, 128 85, 128 103" fill="#F4EFE6"/>

    <!-- Dome finial -->
    <line x1="100" y1="82" x2="100" y2="88" stroke="#E5B869" stroke-width="2"/>
    <circle cx="100" cy="80" r="2.5" fill="#E5B869"/>

    <!-- Small side domes -->
    <path d="M62 110 C62 100, 80 100, 80 110" fill="#E8E2D0"/>
    <path d="M120 110 C120 100, 138 100, 138 110" fill="#E8E2D0"/>

    <!-- Windows on mosque body -->
    <path d="M72 128 C72 124, 78 124, 78 128 L78 134 L72 134 Z" fill="#163E2B" opacity="0.5"/>
    <path d="M122 128 C122 124, 128 124, 128 128 L128 134 L122 134 Z" fill="#163E2B" opacity="0.5"/>
  </g>

  <!-- === OPEN BOOK (Kitab) at bottom of arch === -->
  <g transform="translate(100, 158)">
    <!-- Left page -->
    <path d="M-3 -4 C-3 -4, -28 -8, -30 -2 L-30 10 C-28 4, -3 8, -3 8 Z" fill="#FBF9F4" stroke="#D4A24E" stroke-width="1"/>
    <!-- Right page -->
    <path d="M3 -4 C3 -4, 28 -8, 30 -2 L30 10 C28 4, 3 8, 3 8 Z" fill="#FBF9F4" stroke="#D4A24E" stroke-width="1"/>
    <!-- Spine -->
    <path d="M-3 -4 L0 -6 L3 -4 L0 8 Z" fill="#E5B869"/>
    <!-- Text lines on left page -->
    <line x1="-24" y1="0" x2="-8" y2="-1" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
    <line x1="-22" y1="3" x2="-8" y2="2" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
    <line x1="-20" y1="6" x2="-8" y2="5" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
    <!-- Text lines on right page -->
    <line x1="8" y1="-1" x2="24" y2="0" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
    <line x1="8" y1="2" x2="22" y2="3" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
    <line x1="8" y1="5" x2="20" y2="6" stroke="#163E2B" stroke-width="0.7" opacity="0.3"/>
  </g>

  <!-- === DECORATIVE GOLD DIAMOND below === -->
  <g transform="translate(100, 188)">
    <polygon points="0,-4 3,0 0,4 -3,0" fill="#E5B869"/>
    <line x1="-22" y1="0" x2="-5" y2="0" stroke="#E5B869" stroke-width="1.2"/>
    <line x1="5" y1="0" x2="22" y2="0" stroke="#E5B869" stroke-width="1.2"/>
  </g>
</svg>