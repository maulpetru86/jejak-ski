  <!-- Crescent moon -->
  <circle cx="16" cy="9" r="2.5" fill="#E5B869"/>
  <circle cx="17" cy="8.2" r="2" fill="#0E291C"/>
  
  <!-- Main dome -->
  <path d="M11 19 C11 14, 21 14, 21 19" fill="#E8E2D0"/>
  
  <!-- Mosque body -->
  <rect x="10" y="19" width="12" height="5" fill="#E8E2D0"/>
  
  <!-- Doorway -->
  <path d="M14.5 24 L14.5 21 C14.5 19.5, 17.5 19.5, 17.5 21 L17.5 24 Z" fill="#163E2B"/>
  
