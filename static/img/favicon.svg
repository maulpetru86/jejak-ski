<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#163E2B"/>
  
  <!-- Gold arch border -->
  <path d="M16 3 C16 3, 27 10, 27 18 C27 24, 22 28, 16 28 C10 28, 5 24, 5 18 C5 10, 16 3, 16 3Z"
        fill="none" stroke="#E5B869" stroke-width="1.5"/>
  
  <!-- Inner arch -->
