  <!-- Right minaret -->
  <rect x="22" y="16" width="2" height="8" fill="#E8E2D0"/>
  <polygon points="23,14 21.5,16 24.5,16" fill="#E5B869"/>
  
  <!-- Dome finial -->
  <circle cx="16" cy="13.5" r="1" fill="#E5B869"/>
  
  <!-- Book at bottom -->
  <path d="M12 25.5 L16 24.5 L20 25.5 L16 26.5 Z" fill="#E5B869" opacity="0.8"/>
